<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidLab - Standalone Static Preview v2.6</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Prebid.js -->
    <script async src="https://acdn.adnxs.com/prebid/not-for-prod/prebid.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bidlab': {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                            950: '#082f49',
                        },
                    },
                },
            },
        }
    </script>
    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap');
        body {
            margin: 0;
            background-color: #0f172a;
            color: rgba(255, 255, 255, 0.87);
            font-family: 'Inter', sans-serif;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        const PREBID_TIMEOUT = 2000;

        const JURISDICTIONS = {
            'none': {
                name: 'No Restrictions',
                flag: '🌐',
                gppString: null,
                applicableSections: [],
                description: 'Standard global behavior with no privacy signals.'
            },
            'eu_tcf': {
                name: 'EU (TCF v2.2)',
                flag: '🇪🇺',
                gppString: 'DBABMA~CPabcdefghijklnopqrstuvwxyz.QA',
                applicableSections: [2],
                description: 'GDPR compliance mode using Transparency & Consent Framework.'
            },
            'us_nat': {
                name: 'US National',
                flag: '🇺🇸',
                gppString: 'DBABLA~BVaaaaaa.QA',
                applicableSections: [7],
                description: 'IAB US National Privacy string for multi-state compliance.'
            },
            'us_ca': {
                name: 'California (CCPA/CPRA)',
                flag: '🐻',
                gppString: 'DBABMA~BVaaaaaa.QA',
                applicableSections: [8],
                description: 'California-specific privacy signals (Do Not Sell/Share).'
            },
            'us_va': {
                name: 'Virginia (VCDPA)',
                flag: '🏛️',
                gppString: 'DBABNA~BVaaaaaa.QA',
                applicableSections: [9],
                description: 'Virginia-specific privacy signals for consumer data protection.'
            }
        };

        const PrivacyDashboard = ({ activeJurisdiction, onJurisdictionChange, gpcActive, onGpcToggle }) => {
            const current = JURISDICTIONS[activeJurisdiction];

            return (
                <div className="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 backdrop-blur-sm shadow-xl relative overflow-hidden group">
                    <div className="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/5 rounded-full blur-3xl group-hover:bg-indigo-500/10 transition-colors duration-700"></div>
                    
                    <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 relative z-10">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 bg-indigo-600/20 rounded-xl flex items-center justify-center border border-indigo-500/30">
                                <svg className="w-7 h-7 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                </svg>
                            </div>
                            <div>
                                <h2 className="text-2xl font-black text-white tracking-tight">Privacy Playground</h2>
                                <p className="text-slate-500 text-[10px] uppercase tracking-[0.2em] font-bold">Global Privacy Platform (GPP)</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-3 self-end md:self-auto">
                            <div className="flex items-center gap-3 px-4 py-2 bg-slate-900/60 rounded-xl border border-slate-700/50 shadow-inner">
                                <span className={`text-[10px] font-black uppercase tracking-widest ${gpcActive ? 'text-emerald-400' : 'text-slate-500'}`}>GPC Signal</span>
                                <button onClick={onGpcToggle} className={`relative inline-flex h-5 w-10 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out ${gpcActive ? 'bg-emerald-600' : 'bg-slate-700'}`}>
                                    <span className={`pointer-events-none inline-block h-4 w-4 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${gpcActive ? 'translate-x-5' : 'translate-x-0'}`}></span>
                                </button>
                            </div>

                            <div className="flex items-center gap-2 px-3 py-2 bg-green-500/10 border border-green-500/20 rounded-xl">
                                <div className="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></div>
                                <span className="text-[10px] font-black text-green-400 uppercase tracking-wider">Signals Active</span>
                            </div>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4 mb-8 relative z-10">
                        {Object.entries(JURISDICTIONS).map(([id, data]) => (
                            <button
                                key={id}
                                onClick={() => onJurisdictionChange(id)}
                                className={`group relative flex flex-col items-center justify-center p-5 rounded-2xl border transition-all duration-500 overflow-hidden ${
                                    activeJurisdiction === id
                                        ? 'bg-indigo-600/20 border-indigo-500 shadow-[0_0_30px_rgba(99,102,241,0.2)]'
                                        : 'bg-slate-900/40 border-slate-700/50 hover:border-slate-500'
                                }`}
                            >
                                <span className="text-3xl mb-3 group-hover:scale-125 transition-transform duration-500 block">{data.flag}</span>
                                <span className={`text-[11px] font-black uppercase tracking-tight text-center leading-tight transition-colors duration-300 ${
                                    activeJurisdiction === id ? 'text-indigo-300' : 'text-slate-500 group-hover:text-slate-300'
                                }`}>
                                    {data.name}
                                </span>
                                <div className={`absolute bottom-0 left-0 h-1 bg-indigo-500 transition-all duration-500 ${activeJurisdiction === id ? 'w-full opacity-100' : 'w-0 opacity-0'}`}></div>
                            </button>
                        ))}
                    </div>

                    <div className="bg-slate-900/80 border border-slate-700/50 rounded-2xl overflow-hidden relative group/card shadow-2xl">
                        <div className="relative z-10 flex flex-col lg:flex-row divide-y lg:divide-y-0 lg:divide-x divide-slate-800/80">
                            <div className="flex-1 p-6 space-y-4 text-left">
                                <h3 className="text-slate-200 font-black text-[10px] uppercase tracking-[0.2em] mb-3">Signal Policy</h3>
                                <p className="text-slate-400 text-sm leading-relaxed font-medium italic">"{current.description}"</p>
                                <div className="pt-2 flex flex-wrap gap-2">
                                    <span className={`px-2 py-1 rounded-md text-[9px] font-black uppercase border tracking-widest ${gpcActive ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>GPC: {gpcActive ? 'Enforced' : 'Off'}</span>
                                </div>
                            </div>
                            <div className="flex-[1.5] p-6 space-y-4 text-left">
                                <h3 className="text-slate-200 font-black text-[10px] uppercase tracking-[0.2em] mb-3">GPP Transparency String</h3>
                                <div className="font-mono text-[10px] bg-black/60 p-5 rounded-xl border border-slate-700/50 text-indigo-400 break-all leading-relaxed shadow-inner min-h-[60px] flex items-center justify-center text-center">
                                    {current.gppString || <span className="italic text-slate-700 uppercase tracking-normal">No signals provided.</span>}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const LogPanel = ({ logs }) => {
            const logEndRef = useRef(null);
            const [expandedLogs, setExpandedLogs] = useState({});

            useEffect(() => {
                if (logEndRef.current) {
                    logEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [logs]);

            return (
                <div className="bg-slate-900 border border-slate-700 rounded-2xl overflow-hidden shadow-2xl flex flex-col h-[500px] lg:h-[650px] relative group text-left">
                    <div className="bg-slate-800 px-5 py-4 border-b border-slate-700 flex justify-between items-center relative z-10">
                        <div className="flex gap-2">
                            <div className="w-3 h-3 rounded-full bg-rose-500/80"></div>
                            <div className="w-3 h-3 rounded-full bg-amber-500/80"></div>
                            <div className="w-3 h-3 rounded-full bg-emerald-500/80"></div>
                        </div>
                        <span className="text-[10px] font-black font-mono text-slate-400 tracking-[0.2em] uppercase">Auction_Debugger_v2.6</span>
                        <span className="flex items-center gap-1.5 text-[9px] font-black font-mono text-bidlab-400 bg-bidlab-500/10 px-2.5 py-1 rounded-md border border-bidlab-500/20 uppercase">
                            LIVE
                        </span>
                    </div>

                    <div className="flex-grow overflow-y-auto p-5 font-mono text-sm custom-scrollbar bg-[#050811]">
                        <div className="space-y-2">
                            {logs.map((log, index) => (
                                <div key={index} className="flex flex-col border-b border-slate-800/20 pb-2 last:border-0 group/log">
                                    <div className="flex gap-4 leading-relaxed items-start">
                                        <span className="flex-shrink-0 text-slate-600 select-none text-[10px] w-24 font-bold tabular-nums pt-0.5">
                                            {log.ts}
                                        </span>
                                        <div className="flex-grow flex flex-col min-w-0">
                                            <div className="flex items-center gap-2 flex-wrap">
                                                {log.type === 'privacy' && <span className="px-1.5 py-0.5 rounded bg-indigo-500/20 border border-indigo-500/30 text-indigo-400 text-[9px] font-black uppercase tracking-tighter shadow-sm">Privacy</span>}
                                                <span className={`text-[13px] font-medium ${log.type === 'event' ? 'text-blue-300' : ''} ${log.type === 'privacy' ? 'text-indigo-300' : ''} ${log.type === 'bid' ? 'text-emerald-300' : ''} ${log.type === 'error' ? 'text-rose-400 font-bold' : ''} break-all`}>
                                                    {log.msg}
                                                </span>
                                                {log.details && <button onClick={() => setExpandedLogs(p => ({...p, [index]: !p[index]}))} className="ml-auto text-[9px] bg-slate-800 hover:bg-slate-700 text-slate-400 px-2 py-0.5 rounded transition-all font-black uppercase tracking-widest">{expandedLogs[index] ? 'Hide' : 'Object'}</button>}
                                            </div>
                                            {log.details && expandedLogs[index] && (
                                                <div className="mt-2.5 p-4 bg-black/40 rounded-xl border border-slate-800/80 overflow-x-auto text-[11px] text-slate-400 leading-tight">
                                                    <pre>{JSON.stringify(log.details, null, 2)}</pre>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            ))}
                            <div ref={logEndRef} />
                        </div>
                    </div>

                    <div className="bg-slate-800/50 px-5 py-2.5 border-t border-slate-700/50 flex justify-between items-center text-[9px] font-black font-mono text-slate-500 uppercase tracking-widest">
                        <span>EVENTS: {logs.filter(l => l.type === 'event').length}</span>
                        <span>BIDS: {logs.filter(l => l.type === 'bid').length}</span>
                        <span>PRIVACY: {logs.filter(l => l.type === 'privacy').length}</span>
                    </div>
                </div>
            );
        };

        const AdSlot = ({ winner, status }) => {
            const slotRef = useRef(null);

            useEffect(() => {
                if (winner && slotRef.current) {
                    renderWinner(winner);
                } else if (!winner && slotRef.current) {
                    slotRef.current.innerHTML = '';
                }
            }, [winner]);

            const renderWinner = (bid) => {
                const slot = slotRef.current;
                slot.innerHTML = '';
                const iframe = document.createElement('iframe');
                iframe.width = 300; iframe.height = 250; iframe.frameBorder = "0"; iframe.scrolling = "no"; iframe.className = "rounded-lg shadow-sm";
                slot.appendChild(iframe);
                const iframeDoc = iframe.contentWindow.document;
                iframeDoc.open();
                if (bid.ad && bid.ad.includes('<html')) {
                    iframeDoc.write(bid.ad);
                } else {
                    iframeDoc.write(`
                        <style>
                            body { margin: 0; font-family: sans-serif; cursor: pointer; overflow: hidden; background: #fff; }
                            .ad { width: 300px; height: 250px; display: flex; flex-direction: column; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; position: relative; }
                            img { width: 300px; height: 135px; object-fit: cover; }
                            .content { padding: 12px; }
                            .title { font-weight: 800; font-size: 15px; margin-bottom: 2px; color: #0f172a; }
                            .desc { font-size: 12px; color: #64748b; line-height: 1.3; margin-bottom: 10px; }
                            .footer { display: flex; justify-content: space-between; align-items: center; }
                            .cta { background: #0284c7; color: white; padding: 4px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; }
                        </style>
                        <div class="ad">
                            <img src="https://picsum.photos/seed/tech/300/150">
                            <div class="content">
                                <div class="title">Static Simulation</div>
                                <div class="desc">Bidder: ${bid.bidder.toUpperCase()}</div>
                                <div class="footer"><div class="cta">Explore</div></div>
                            </div>
                        </div>
                    `);
                }
                iframeDoc.close();
            };

            return (
                <div className="bg-slate-800/80 border border-slate-700 p-1 rounded-2xl overflow-hidden shadow-2xl backdrop-blur-md">
                    <div className="bg-slate-900/50 p-4 border-b border-slate-700/50 flex justify-between items-center text-left">
                        <div className="flex items-center gap-2">
                            <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                            <span className="text-xs font-bold text-slate-300 tracking-wider uppercase">Active Slot: top_sidebar</span>
                        </div>
                        <div className="text-[10px] font-mono text-slate-500 bg-slate-800 px-2 py-0.5 rounded">300x250</div>
                    </div>
                    
                    <div className="p-6 flex flex-col items-center justify-center min-h-[300px] relative">
                        <div ref={slotRef} className={`w-[300px] h-[250px] transition-all duration-500 flex items-center justify-center rounded-lg ${winner ? 'scale-100 opacity-100' : 'bg-slate-800/50 border-2 border-dashed border-slate-700 scale-95'}`}>
                            {!winner && <span className="text-sm font-medium text-slate-500 uppercase tracking-widest font-black">Awaiting Auction</span>}
                        </div>
                        <div className="mt-6 w-full max-w-[300px] text-left">
                            <div className="flex justify-between items-end">
                                <div>
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Status</span>
                                    <div className="text-sm font-bold tracking-tight text-slate-300">{status}</div>
                                </div>
                                {winner && <div>
                                    <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Winning CPM</span>
                                    <div className="text-sm font-mono font-bold text-green-400">${winner.cpm.toFixed(2)}</div>
                                </div>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [logs, setLogs] = useState([]);
            const [status, setStatus] = useState('Ready');
            const [winner, setWinner] = useState(null);
            const [isAuctionRunning, setIsAuctionRunning] = useState(false);
            const [jurisdiction, setJurisdiction] = useState('none');
            const [gpcActive, setGpcActive] = useState(false);

            const addLog = useCallback((msg, type = 'event', details = null) => {
                const ts = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setLogs(prevLogs => [...prevLogs, { ts, msg, type, details }]);
            }, []);

            const runAuction = () => {
                const pbjs = window.pbjs || {};
                setIsAuctionRunning(true); setWinner(null); setStatus("Auctioning...");
                addLog("Starting Prebid.js Distributed Auction", "event");
                
                if (gpcActive) addLog("Global Privacy Control (GPC) active", "privacy");
                const openRtbRequest = { regs: { gpc: gpcActive ? '1' : '0', ...(jurisdiction !== 'none' ? { gpp: JURISDICTIONS[jurisdiction].gppString, gpp_sid: JURISDICTIONS[jurisdiction].applicableSections } : {}) } };
                addLog(`OpenRTB BidRequest serialized with privacy regs`, "privacy", openRtbRequest);

                setTimeout(() => {
                    const mockBid = { bidder: 'appnexus', cpm: (Math.random()*10+1), timeToRespond: 200, adUnitCode: 'ad-slot-1' };
                    addLog(`Mock bid received: ${mockBid.bidder} ($${mockBid.cpm.toFixed(2)})`, "bid");
                    setWinner(mockBid); setStatus(`Served by ${mockBid.bidder}`); setIsAuctionRunning(false);
                }, 1000);
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-200 font-sans selection:bg-bidlab-500/30">
                    <div className="relative max-w-6xl mx-auto px-4 py-8 md:py-12">
                        <header className="mb-12 text-center md:text-left flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-slate-800/80 pb-8 relative">
                            <div className="absolute -bottom-px left-0 w-32 h-px bg-gradient-to-r from-bidlab-500 to-transparent"></div>
                            <div>
                                <h1 className="text-4xl font-black tracking-tighter text-white">Bid<span className="text-bidlab-500">Lab</span></h1>
                                <p className="text-slate-400 text-lg font-medium">Real-time Header Bidding & Privacy Signal Playground.</p>
                            </div>
                            <div className="flex flex-wrap justify-center gap-3">
                                <button onClick={runAuction} disabled={isAuctionRunning} className={`px-6 py-3 rounded-xl font-black transition-all ${isAuctionRunning ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-bidlab-600 hover:bg-bidlab-500 text-white'}`}>{isAuctionRunning ? 'Auctioning...' : 'Trigger Auction'}</button>
                                <button onClick={() => window.location.reload()} className="px-6 py-3 rounded-xl font-black bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all border border-slate-700/80 shadow-md tracking-tight">Reset</button>
                            </div>
                        </header>

                        <div className="mb-12">
                            <PrivacyDashboard activeJurisdiction={jurisdiction} onJurisdictionChange={setJurisdiction} gpcActive={gpcActive} onGpcToggle={() => setGpcActive(!gpcActive)} />
                        </div>

                        <main className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            <div className="lg:col-span-7 order-2 lg:order-1"><LogPanel logs={logs} /></div>
                            <div className="lg:col-span-5 order-1 lg:order-2 space-y-6"><AdSlot winner={winner} status={status} /></div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
